# Local development — database only.
#
# Next.js runs OUTSIDE Docker: npm run dev
# This file spins up only PostgreSQL so the dev server can connect to it.
#
# Start:   docker compose -f src/env/local/docker-compose.yml up -d
# Stop:    docker compose -f src/env/local/docker-compose.yml down
# Logs:    docker compose -f src/env/local/docker-compose.yml logs -f postgres
# Shell:   docker compose -f src/env/local/docker-compose.yml exec postgres psql -U kachok -d kachok
# Destroy: docker compose -f src/env/local/docker-compose.yml down -v  (drops data too)

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Defaults work out of the box for local dev.
      # Override by setting the same vars in your shell or a local .env file.
      POSTGRES_DB: ${POSTGRES_DB:-kachok}
      POSTGRES_USER: ${POSTGRES_USER:-kachok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kachok_dev}
    volumes:
      # Data is stored next to this file so it's easy to find and wipe.
      # postgres-data/ is gitignored — never committed.
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed on localhost so `npm run dev` can reach it at localhost:5432
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
