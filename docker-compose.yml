services:

  # ── Next.js application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Bind to 127.0.0.1 so the port is reachable only by nginx on the same host.
    # nginx proxies kachok-kolya.duckdns.org → http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # When a .env file is present on the host, its variables are forwarded here.
    # Useful for DATABASE_URL, AUTH_SECRET, etc. in future versions.
    # env_file:
    #   - .env
    #
    # Uncomment and extend once DB/Redis are added:
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy

