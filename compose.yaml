name: kachok-local
services:
  mailpit:
    image: axllent/mailpit:v1.27.10
    environment:
      # Обратный DNS в изолированной сети Docker может задерживать SMTP greeting.
      MP_SMTP_DISABLE_RDNS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_QUIET: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: kachok
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: kachok_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    # Даже текст ошибки SQL способен включать личное значение. Наблюдение
    # неуспеха идёт через безопасные коды границы хранения, без исходных ошибок БД.
    command: ["postgres", "-c", "log_min_messages=panic", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kachok -d kachok_local"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres-data:
